name: Release v1.0.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test Linux implementation
        run: python3 -m unittest discover -s tests -v

      - name: Validate scripts
        shell: bash
        run: |
          python3 -m py_compile linux/auto_cleanup.py cleanup.py
          bash -n linux/install.sh linux/uninstall.sh

      - name: Parse Windows PowerShell scripts
        shell: pwsh
        run: |
          $Failed = $false
          Get-ChildItem windows/*.ps1 | ForEach-Object {
            $Tokens = $null
            $Errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$Tokens, [ref]$Errors
            )
            if ($Errors.Count) {
              $Errors | ForEach-Object { Write-Error $_ }
              $Failed = $true
            }
          }
          if ($Failed) { exit 1 }

      - name: Build release archives
        shell: bash
        run: |
          version='v1.0.0'
          mkdir -p dist/linux-package/linux dist/windows-package/windows
          cp linux/auto_cleanup.py linux/install.sh linux/uninstall.sh dist/linux-package/linux/
          cp windows/*.ps1 dist/windows-package/windows/
          cp README.md CHANGELOG.md LICENSE dist/linux-package/
          cp README.md CHANGELOG.md LICENSE dist/windows-package/
          tar -C dist/linux-package -czf "dist/hypr-auto-cleanup-linux-${version}.tar.gz" .
          (cd dist/windows-package && zip -qr "../hypr-auto-cleanup-windows-${version}.zip" .)
          sha256sum dist/*.tar.gz dist/*.zip > dist/SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          assets=(
            dist/hypr-auto-cleanup-linux-v1.0.0.tar.gz
            dist/hypr-auto-cleanup-windows-v1.0.0.zip
            dist/SHA256SUMS.txt
          )
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 "${assets[@]}" --clobber
          else
            gh release create v1.0.0 "${assets[@]}" \
              --title 'Hypr Auto-Cleanup v1.0.0' \
              --notes 'First cross-platform release: Hyprland/Linux and Windows 10/11.'
          fi
